name: 三天文台多波段星表交叉匹配与颜色分析
steps:
  - id: g_catalog
    operator: read_item@1.0
    inputs: {}
    params: {uri: $G_CATALOG_URI, view: bytes}
  - id: select_g
    operator: observatory_select@1.0
    inputs: {source: g_catalog}
    params: {operation: select, cone: $CONE, min_snr: $MIN_SNR}
  - id: r_catalog
    operator: read_item@1.0
    inputs: {}
    params: {uri: $R_CATALOG_URI, view: bytes}
  - id: select_r
    operator: observatory_select@1.0
    inputs: {source: r_catalog}
    params: {operation: select, cone: $CONE, min_snr: $MIN_SNR}
  - id: i_catalog
    operator: read_item@1.0
    inputs: {}
    params: {uri: $I_CATALOG_URI, view: bytes}
  - id: select_i
    operator: observatory_select@1.0
    inputs: {source: i_catalog}
    params: {operation: select, cone: $CONE, min_snr: $MIN_SNR}
  - id: colors
    operator: observatory_crossmatch@1.0
    inputs: {g: select_g, r: select_r, i: select_i}
    params: {operation: crossmatch, cone: $CONE, match_radius_arcsec: $MATCH_RADIUS_ARCSEC}
outputs:
  result: colors
