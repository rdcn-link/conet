<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数据分析应用</title><link rel="icon" href="/assets/conet-mark.svg" type="image/svg+xml"><link rel="stylesheet" href="/appbuilder/assets/appbuilder.css"><link rel="stylesheet" href="/appbuilder/assets/application.css"><link rel="stylesheet" href="/appbuilder/assets/product.css"><script src="/appbuilder/assets/workspace-context.js"></script></head>
<body class="published-app"><header class="app-header"><div class="app-identity"><img class="app-mark" src="/assets/conet-mark.svg" alt="CONET"><div><small>在线数据分析</small><h1 id="title">正在加载应用…</h1></div></div><div class="app-header-actions"><button id="share" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 13 4-4M8 16l-1 1a4 4 0 0 1-6-6l4-4a4 4 0 0 1 6 0m2 1 1-1a4 4 0 0 1 6 6l-4 4a4 4 0 0 1-6 0" transform="translate(1 0)"/></svg>分享应用</button><a href="/workspace/" style="font-size:12px">工作空间</a></div></header>
<main class="app-main"><div class="app-hero"><div class="app-hero-copy"><small>连接数据 · 在线分析</small><h2 id="hero-title">从数据到发现</h2><p id="description"></p><div id="app-tags" class="app-tags"></div></div><img id="hero-cover" class="app-hero-image" alt="应用场景" hidden></div><p id="notice" role="status" aria-live="polite"></p>
<section class="input-panel"><div class="section-heading"><span class="section-number">01</span><div><h2>设置分析条件</h2><p>选择关注范围，调整参数后开始分析</p></div></div><form id="form"><div id="inputs"></div><div class="form-actions"><small id="disclaimer"></small><button id="submit" class="primary" type="submit">开始分析 <span aria-hidden="true">→</span></button></div></form></section>
<section class="progress-panel"><div class="progress-summary"><div class="section-heading"><span class="section-number">02</span><div><h2 id="job-state">准备就绪</h2><p id="job-id">提交后可在这里查看分析进度</p></div></div><span id="duration"></span><details class="progress-details"><summary>处理步骤</summary><div id="steps"></div></details></div></section>
<section class="result-panel"><div class="section-heading"><span class="section-number">03</span><div><h2>分析结果</h2><p>图表、空间分布与可下载成果</p></div></div><div id="empty" class="result-empty"><svg viewBox="0 0 80 64" aria-hidden="true"><rect x="9" y="8" width="62" height="44" rx="6"/><path d="m20 40 13-14 12 9 15-17M26 56h28"/><circle cx="33" cy="26" r="3"/><circle cx="45" cy="35" r="3"/></svg><h3>等待你的第一次分析</h3><p>设置上方的条件并点击“开始分析”，结果将在此展示。</p></div><div id="results" hidden><div id="views"></div><div class="result-downloads"><h3>下载分析成果</h3><div id="downloads"></div></div></div></section>
<details class="history-panel"><summary>历史分析记录<span>查看已提交的分析与成果</span></summary><div id="history"></div></details></main><footer class="app-footer">由 CONET 提供数据协作与分析支持</footer><script src="/appbuilder/assets/runtime.js"></script><script src="/appbuilder/assets/product-publishing.js"></script><script src="/appbuilder/assets/application.js"></script></body></html>
