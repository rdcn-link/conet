<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CONET App Builder</title><link rel="stylesheet" href="/appbuilder/assets/appbuilder.css"><link rel="stylesheet" href="/appbuilder/assets/visual-editor.css"><link rel="stylesheet" href="/navigation.css"><header class="conet-navigation"><a class="conet-brand" href="/"><img src="/assets/conet-mark.svg" alt=""><strong>CONET</strong><span>数据协作网络</span></a><nav aria-label="主导航"><a href="/services/"><i aria-hidden="true">▦</i>应用服务</a><a href="/nodes/"><i aria-hidden="true">▱</i>节点列表</a><a href="/catalog/"><i aria-hidden="true">▤</i>数据目录</a><a href="/appbuilder/" aria-current="page"><i aria-hidden="true">◇</i>App Builder</a><a href="/workspace/"><i aria-hidden="true">▦</i>工作空间</a><a href="/screen"><i aria-hidden="true">◎</i>协作大屏</a></nav></header><main><section><div style="display:flex;justify-content:space-between;align-items:center"><h2>应用与资源使用统计</h2><button id="refresh-stats">↻ 更新统计</button></div><div id="stat-totals" class="metrics"></div><details><summary>查看分类统计明细</summary><div id="statistics"></div></details><small>应用按受理提交计数；数据集按实际启动的读取步骤计数；算子按步骤与执行尝试计数；节点按已确认接收的子任务计数。轮询不会重复累计。</small></section><p id="notice" role="status" aria-live="polite"></p><div class="workspace"><aside class="panel"><button id="new-app" class="primary">＋ 新建应用</button><button id="import-package">⇧ 导入应用程序包</button><input id="package-file" type="file" accept=".zip" hidden><p>应用程序包包含流程与应用配置，可导入、编辑并加载运行。</p><h2>已加载应用</h2><div id="apps"></div><p>选择应用查看信息，点击“编辑”后修改；也可复制为新应用。</p></aside><article><section id="app-overview"><img id="overview-cover" alt="应用展示图片"><div class="overview-body"><small id="overview-id"></small><h2 id="overview-title">选择应用或新建应用</h2><p id="overview-description"></p><div class="overview-actions"><a id="open-app" class="button" target="_blank" rel="noopener">↗ 打开应用</a><button id="edit-app" class="primary">✎ 编辑</button><button id="duplicate-app">▣ 复制应用</button><a id="download-package" class="button">⇩ 导出程序包</a></div><p id="overview-url"></p></div></section><section id="app-editor" hidden><div class="editor-actionbar"><strong id="editing-title">编辑应用</strong><button id="finish-edit" type="button">结束编辑</button><button id="assistant-open" type="button">✧ 对话生成配置</button><button id="validate">✓ 校验配置</button><button id="preview">◉ 预览表单</button><button id="export-package">⇩ 导出程序包</button><button id="publish" class="primary">▶ 加载并发布</button></div><div id="published"></div><div class="editor-tabs" role="tablist" aria-label="配置编辑方式"><button data-editor="job" role="tab" aria-selected="true">◇ 流程设计</button><button data-editor="basic" role="tab" aria-selected="false">◈ 应用信息</button><button data-editor="inputs" role="tab" aria-selected="false">▦ 输入表单</button><button data-editor="variables" role="tab" aria-selected="false">↗ 变量绑定</button><button data-editor="result" role="tab" aria-selected="false">▥ 结果与下载</button><button data-editor="options" role="tab" aria-selected="false">⚙ 运行设置</button><button data-editor="source" role="tab" aria-selected="false">〈〉 YAML 源码</button></div><div id="application-visual" hidden></div><div id="job-visual"></div><div id="source-editor" class="editors" hidden><label>应用定义 · application.yaml<textarea id="application" spellcheck="false"></textarea></label><label>分析流程 · Job YAML<textarea id="job" spellcheck="false"></textarea></label></div></section><section id="preview-panel" hidden><h2>参数表单预览</h2><p>此处仅预览输入界面，不提交分析任务。</p><div id="preview-inputs"></div></section></article></div></main><script src="/appbuilder/assets/runtime.js"></script><script src="/appbuilder/assets/presentation.js"></script><script src="/appbuilder/assets/configuration-forms.js"></script><script src="/appbuilder/assets/visual-editor.js"></script><script src="/appbuilder/assets/assistant.js"></script><script src="/appbuilder/assets/builder.js"></script></html>
