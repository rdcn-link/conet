<!doctype html><html lang="zh-CN"><meta charset="utf-8"><style>*{box-sizing:border-box}html,body{height:100%;margin:0;font:11px system-ui;background:#edf3f4;color:#4e7582}#map,#coordinate-map{position:absolute;inset:0;width:100%;height:100%}#coordinate-map{background:#edf3f1;touch-action:none}#tools{position:absolute;z-index:1000;top:12px;left:12px;display:flex;gap:4px;background:#fffffff2;padding:5px;border:1px solid #d6e3e4;border-radius:8px;box-shadow:0 3px 14px #204c5810}button{padding:5px 8px;border:0;background:#f1f6f7;border-radius:5px;color:#416f7c;cursor:pointer;font:inherit}button:hover{background:#deedef}#draw{background:#287f8c;color:white}#zoom{position:absolute;right:12px;bottom:42px;z-index:1001;display:grid;gap:3px}#zoom button{background:#fffffff2;font-size:17px;width:29px;padding:2px;border:1px solid #d7e4e7}#status{position:absolute;bottom:8px;left:10px;right:50px;z-index:1000;background:#ffffffe8;padding:5px 9px;border-radius:5px;pointer-events:none;font-size:10px}[hidden]{display:none!important}</style><div id="map" hidden></div><svg id="coordinate-map" viewBox="0 0 900 520" preserveAspectRatio="none" role="img" aria-label="经纬度区域选区"></svg><div id="tools"><button id="draw">绘制多边形</button><button id="done">完成</button><button id="reset">重置</button></div><div id="zoom"><button id="zoom-in" aria-label="放大地图">+</button><button id="zoom-out" aria-label="缩小地图">−</button></div><div id="status">坐标选区 · 正在连接天地图底图</div><script src="/appbuilder/assets/map.js"></script></html>
