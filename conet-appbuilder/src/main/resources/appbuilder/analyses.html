<main><div class="record-heading"><div><p class="eyebrow">分析记录</p><h1 id="page-title">历史分析</h1><p id="page-description">集中查看分析条件、执行过程与成果。</p></div><div class="record-actions"><a id="all-records" href="/analyses/" hidden>全部分析记录</a><button id="refresh-records">刷新记录</button></div></div><p id="record-error" role="alert" hidden></p>
<div id="record-list"><section class="record-filters"><label>应用<select id="filter-app"><option value="">全部应用</option></select></label><label>执行状态<select id="filter-state"><option value="">全部状态</option><option value="succeeded">已完成</option><option value="failed">失败</option><option value="running">执行中</option><option value="queued">排队中</option><option value="cancelled">已取消</option><option value="expired">已超时</option><option value="interrupted">已中断</option></select></label><span id="record-count"></span></section><div id="record-cards"></div></div>

<section id="run-publications"><div class="record-heading"><h2>数据产品发布</h2><button id="publish-run" class="primary" hidden>发布为 DACP 数据集</button></div><div id="publication-list"></div></section></div></main>
