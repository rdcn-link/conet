<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title desc">
  <title id="title">CONET 数据协作网络</title>
  <desc id="desc">三个数据节点以柔和的连接线构成一个简洁的协作网络。</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#142f52"/><stop offset="1" stop-color="#101a36"/></linearGradient>
    <linearGradient id="net" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#66e7ed"/><stop offset="1" stop-color="#5f96ee"/></linearGradient>
  </defs>
  <rect x="2" y="2" width="92" height="92" rx="24" fill="url(#bg)"/>
  <rect x="2.7" y="2.7" width="90.6" height="90.6" rx="23.4" fill="none" stroke="#72d6ec" stroke-opacity=".18"/>
  <path d="M48 26Q34 40 27 65Q48 73 69 65Q62 40 48 26Z" fill="none" stroke="url(#net)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#68e2df" stroke="#142a46" stroke-width="3">
    <circle cx="48" cy="26" r="8"/>
    <circle cx="27" cy="65" r="8"/>
    <circle cx="69" cy="65" r="8"/>
  </g>
</svg>
